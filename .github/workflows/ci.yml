# CI: every push runs the same ladder guards we run locally -- build, vet,
# and the full test suite. The suite includes the real-tool tests (ruff,
# cargo, c++); tests skip cleanly where a tool is absent, so what runs here
# is what the runner can honestly provide.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: install lint and language tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q z3
          pipx install ruff
          pip install pytest tree-sitter tree-sitter-python tree-sitter-rust tree-sitter-cpp tree-sitter-go
          rustup default stable
      - name: gofmt is clean
        run: test -z "$(gofmt -l cmd internal tests)"
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: tests
        run: go test ./tests/ -timeout 20m
